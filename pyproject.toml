[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "korbase"
version = "0.1.0a3"
description = "Async ORM for Postgres and SQLite, built the Korvex way."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maxime Lefevre" }]
keywords = ["orm", "async", "postgres", "sqlite", "sql", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://3d3n-pyc.github.io/korbase/"
Documentation = "https://3d3n-pyc.github.io/korbase/"
Source = "https://github.com/3d3n-pyc/korbase"
Changelog = "https://github.com/3d3n-pyc/korbase/blob/main/CHANGELOG.md"

[project.optional-dependencies]
korpg = []
asyncpg = ["asyncpg>=0.30"]
korvex = ["korvex>=1.0.0rc5"]

[dependency-groups]
dev = [
    "asyncpg>=0.30",
    "korvex>=1.0.0rc5",
    "msgspec",
    "pyright>=1.1.400",
    "pytest>=8.4.2",
    "ruff>=0.14",
]
# The documentation site: `uv run --group docs mkdocs build --strict`.
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.30.1",
    "mkdocs-llmstxt>=0.5.1; python_version >= '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # the formatter wraps code; a long string or comment can stay
    "UP007",  # X | Y: keep annotations readable at runtime on older Pythons
    "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["korbase"]

[tool.pyright]
include = ["korbase"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
