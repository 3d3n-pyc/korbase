name: Performance

# Measures how much korbase adds over the raw driver (benches/perf_check.py)
# for the pull request and for its base branch, in the same job, and prints
# the comparison in the job summary.
#
# Report-only for now: it never fails the pull request. The same
# interpreter measured twice varies by up to about 15% on pg/select_100,
# which is more than a useful limit. Once the noise is lower, drop
# --report-only to make it a gate.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start Postgres
        run: bash tests/pg/start.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install the pull request and its base
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          uv venv --python 3.13 "$RUNNER_TEMP/venv-head"
          uv venv --python 3.13 "$RUNNER_TEMP/venv-base"
          uv pip install --python "$RUNNER_TEMP/venv-head/bin/python" ".[asyncpg]" msgspec
          uv pip install --python "$RUNNER_TEMP/venv-base/bin/python" "$RUNNER_TEMP/base[asyncpg]" msgspec

      - name: Compare
        run: |
          "$RUNNER_TEMP/venv-head/bin/python" benches/perf_check.py compare \
            --base "$RUNNER_TEMP/venv-base/bin/python" \
            --head "$RUNNER_TEMP/venv-head/bin/python" \
            --report-only
