# On a `v*` tag: build the sdist and wheel, check the tag matches the
# version, smoke-test the wheel in a fresh venv, then publish to PyPI.
# Run by hand (workflow_dispatch) to build and test without publishing.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the wheel and run a SQLite smoke test
        run: |
          uv venv --python ${{ matrix.python }} /tmp/venv
          uv pip install --python /tmp/venv/bin/python dist/*.whl
          cat > /tmp/smoke.py <<'PY'
          import asyncio
          from korbase import Database

          async def main():
              db = await Database.connect("sqlite::memory:")
              await db.execute("CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT)")
              await db.execute("INSERT INTO t (name) VALUES ('a')")
              rows = await db.fetch("SELECT name FROM t")
              assert len(rows) == 1, rows
              print(rows)

          asyncio.run(main())
          PY
          /tmp/venv/bin/python -I /tmp/smoke.py

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke]
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
